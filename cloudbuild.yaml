steps:
  # Build the health-checker image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'health-checker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/health-checker/health-checker:latest'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/health-checker/health-checker:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'health-checker'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/health-checker/health-checker:latest'
      - '--region=us-central1'
      - '--project=$PROJECT_ID'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--timeout=300'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/health-checker/health-checker:latest'
